skill: ex-ussr-kinship-research
version: "1.7.0"

# Условные ситуации для содержательной проверки, не автоматические unit-тесты.
logic_cases:
  - id: acquisition_faint_page_not_blank
    request: "OCR вернул пустой текст, доля тёмных пикселей ниже порога. При просмотре страницы заметна бледная приписка. Исключить страницу как пустую?"
    expected:
      - "Не исключать страницу по совпадению двух технических сигналов; проверить видимую приписку."
      - "Сохранить изображение и результат адресного чтения или отметку о неразборчивости."
      - "Порог и пустое OCR не считать доказательством отсутствия текста."

  - id: acquisition_stale_viewer_frame
    request: "После перехода с кадра 25 на 26 URL и поле номера показывают 26, но в области изображения ещё видна отметка кадра 25. Сохрани страницу 26 для ссылки на запись."
    expected:
      - "Дождаться и проверить фактически загруженное изображение; не присвоить кадру 25 адрес кадра 26."
      - "Если соответствие проверить невозможно, обозначить неопределённость и не заявлять получение нужной страницы."

  - id: acquisition_tile_extent
    request: "Сборка из 56 плиток имеет размер 2049×1655 и ноль внутренних пропусков. В просмотрщике справа виден ещё один столбец текста за границей сборки. Можно назвать её полной копией разворота?"
    expected:
      - "Различить полноту полученного прямоугольника и охват страницы; не назвать сборку полной."
      - "Если нужен весь разворот, получить недостающую область и проверить границы; если достаточно фрагмента, обозначить его охват."
      - "Сохранить первую сборку и происхождение новой версии, не объявлять их архивными оригиналами полного разрешения."

  - id: acquisition_distinct_files_same_record
    request: "Кадры 306 и 307 имеют разные SHA-256, но после сопоставления оба показывают лист 259 с теми же девятью актами. На правой половине 308 начинается другая книга. Сколько новых актов добавляет кадр 307 и как описать границу?"
    expected:
      - "Кадр 307 не добавляет новых актов; сохранить обе разные фотографии и их адреса."
      - "Не приравнять номер кадра к номеру листа и не считать разные хеши доказательством разных записей."
      - "Границу книг указать по половинам кадра 308; не переносить обе половины в одну книгу автоматически."

  - id: acquisition_content_not_extension
    request: "93 полученных файла названы .png и имеют сохранённые хеши. Декодер определяет их как JPEG. Нужно ли конвертировать их в PNG, чтобы отчёт стал верным?"
    expected:
      - "Исправить описание фактического формата затронутой партии, сохранив прежние метаданные."
      - "Сохранить исходные байты и имена; не выполнять конвертацию только ради соответствия старому описанию."
      - "Не распространять эту адресную проверку на весь архив без нового основания."

  - id: acquisition_response_and_block_completeness
    request: "Запрос карточки вернул HTTP 200 и текст ошибки. Другой ответ оборвался после полностью закрытой таблицы: в ней 82 строки, счётчик сервиса тоже 82, отсутствует только подвал. Как учесть результаты?"
    expected:
      - "Первый ответ не считать полученной карточкой или отрицательным историческим результатом."
      - "Для второго различить полный блок таблицы и неполный HTTP-ответ; использовать проверенный блок с ограничением охвата."
      - "Полноту ответа или блока не приравнивать к полноте исторической коллекции."

  - id: acquisition_pdf_glyph_mapping
    request: "В PDF есть извлекаемый текст, но видимой кириллице соответствуют бессмысленные символы. Поиск фамилии ничего не находит. Можно закрыть поиск по книге?"
    expected:
      - "Не делать отрицательного вывода по непригодному текстовому слою."
      - "Сопоставить текст с изображением и использовать отдельное OCR или чтение нужных страниц; сохранить оригинал и ошибочное извлечение."
      - "Обозначить фактически проверенный охват и не считать успешное OCR доказательством точности всех чтений."
