skill: ex-ussr-kinship-research
version: "1.7.0"

# Условные ситуации для содержательной проверки, не автоматические unit-тесты.
logic_cases:
  - id: dependence_same_parish_different_information
    request: "В книге одного прихода есть запись рождения и позднейшая запись брака. Вторая прямо ссылается на первую как основание даты рождения; о совершённом браке сообщает отдельно. Объединить все сведения в одну цепочку только из-за прихода?"
    expected:
      - "Для повторённой даты рождения учитывать одну исходную цепочку."
      - "Оценить сведения о состоявшемся браке отдельно, не объявлять их лишёнными самостоятельного значения из-за общего прихода."
      - "Не объявить два подтверждения рождения или брака там, где для каждого события установлена лишь одна цепочка."

  - id: dependence_different_institutions_same_origin
    request: "Дата рождения указана в приходской метрике и военной анкете другого учреждения. Анкета явно переписала дату из этой метрики. Можно поставить corroborated, потому что учреждения разные?"
    expected:
      - "Не считать учреждения доказательством независимости заимствованной даты."
      - "Сохранить общий исходный источник даты и отдельные артефакты; не повышать статус только по их числу."

  - id: dependence_unknown_origin_and_audit
    request: "Два документа имеют разные independence_group. Откуда второй взял дату рождения, неизвестно. Аудит предупреждает о single-source при нескольких группах. Повысим статус, чтобы проверка была чистой? Если нельзя, остановить всю работу, включая другую ветвь с доступными документами, пока не выясним происхождение даты?"
    expected:
      - "Не считать отсутствие обнаруженного копирования доказанной независимостью."
      - "Сохранить консервативный статус и объяснить неопределённость в rationale; не создавать фиктивные артефакты или группы."
      - "Различить подсчёт меток программой и исследовательское установление происхождения сведений."
      - "Зафиксировать неопределённость и продолжить доступное исследование; не делать выяснение происхождения даты условием работы по другой ветви. Дополнительный поиск происхождения обосновать возможным изменением существенного вывода."

  - id: dependence_birth_and_baptism_dates
    request: "В записи брака стоит дата рождения 8 марта. В другой записи 8 марта – день крещения, а ребёнок родился 5 марта. Совпадение 8 марта подтверждает точную дату рождения?"
    expected:
      - "Разделить события рождения и крещения; не считать разные события совпавшей точной датой рождения."
      - "Сохранить конфликт и проверить происхождение даты в брачной записи."
      - "Не выбирать тождество людей только по совпавшему числу."
