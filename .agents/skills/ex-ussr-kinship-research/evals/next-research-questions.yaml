skill: ex-ussr-kinship-research
version: "1.7.0"

# Условные ситуации для содержательной проверки, не автоматические unit-тесты.
logic_cases:
  - id: next_questions_ranked_when_useful
    request: |
      Этап закончен. Онлайн прочитаны все метрики прихода за 1886–1918 гг.
      Известно: исповедные ведомости того же села за 1818–1848 гг. есть в
      онлайн-каталоге, но ещё не открывались; посемейные списки 1905 г. есть
      только в архиве, копия платная; у двух прадедов места рождения
      неизвестны. Что дальше?
    expected:
      - "Ответить компактным упорядоченным списком полезных проверок с учётом исследовательского вопроса, усилий и зависимостей; не задавать обязательное число пунктов."
      - "Для существенных пунктов пояснить, что они решат, где источник, кто выполняет проверку и от чего она зависит."
      - "Отметить, что доступ и содержание ведомостей 1818–1848 гг. ещё не проверены; оценить связь с установленной линией, прежде чем обещать продвижение на поколения назад."
      - "Для уточнения мест рождения предложить проверить документы родственников и записать семейные воспоминания как отдельные свидетельства."
      - "Для платного запроса указать, какой вопрос он закроет; цену и сроки сообщать только если известны, иначе прямо обозначить неизвестное."
      - "Продолжать доступные проверки самостоятельно без ожидания выбора пользователя после каждого этапа."

  - id: next_questions_as_parallel_tasks
    request: "Пользователь хочет запустить по следующим вопросам несколько параллельных агентов. Оформи задания."
    expected:
      - "Применить существующие рекомендации references/research-coordination.md к уже согласованной параллельной работе и передать достаточный контекст."
      - "Разделить запись и согласовать уникальность ID существующим способом, сохраняя переиспользование материалов; общий источник сам по себе не запрещает работу разных исполнителей."
      - "Указать существенные зависимости и фактический охват при передаче результата, сохраняя полезные частичные результаты."

  - id: next_questions_unverified_access
    request: "В списке следующих шагов агент пишет: «ревизские сказки 1858 г. по селу есть онлайн». Он этого не проверял, просто предполагает. Как правильно?"
    expected:
      - "Пометить доступность как непроверенную или сначала проверить каталог."
      - "Не выдавать предположение о наличии источника за установленный факт."

  - id: next_questions_brief_answer
    request: "Проверка одной метрической записи завершена. Пользователь просит коротко назвать прочитанную дату и оставшуюся неопределённость."
    expected:
      - "Ответить по существу со ссылкой на источник и обозначить неопределённость."
      - "Не добавлять обязательный список следующих вопросов, пустую таблицу или выдуманные задачи ради заполнения формы."
