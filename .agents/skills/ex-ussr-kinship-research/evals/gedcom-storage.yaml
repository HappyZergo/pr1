skill: ex-ussr-kinship-research
version: "1.20.0"

# Условные ситуации обмена древом (references/gedcom.md), не автоматические unit-тесты.
logic_cases:
  - id: gedcom_portable_tree_without_app
    request: "Собери по этим документам семейное древо, чтобы потом открыть его в генеалогической программе. Программу я ещё не выбрал."
    expected:
      - "Подготовить отдельный локальный .ged в GEDCOM 5.5.1 UTF-8 с источниками и заметками о доказанности."
      - "Не требовать установить приложение или подключить MCP; исследование и реестры продолжаются."
      - "Не обещать проверенный импорт во все программы."

  - id: gedcom_connected_service_does_not_select_destination
    request: "Собери семейное древо по моим документам. [В среде доступен подключённый сервис генеалогических деревьев; пользователь не выбрал его для задачи.]"
    expected:
      - "Не выбирать внешний проект и не читать или изменять его лишь из-за наличия подключения."
      - "Работать с предоставленными материалами и подготовить локальный переносимый результат; выбор программы и её подключение остаются за пользователем."

  - id: gedcom_explicit_destination_wins
    request: "Сохрани древо в /cases/demo/result.ged для программы, которая поддерживает GEDCOM 7. Мой исходный файл /cases/demo/original.ged не меняй."
    expected:
      - "Создать result.ged в GEDCOM 7, сохранив original.ged неизменным."
      - "Не подменять выбор пользователя другой программой, версией или внешним хранилищем."

  - id: gedcom_import_is_not_evidence
    request: "В присланном GEDCOM записано, что отец Анны — Иван, и есть ссылка на сайт с копией того же древа. Можно считать связь подтверждённой двумя источниками?"
    expected:
      - "Сохранить файл как материалы пользователя, связь — как гипотезу до оценки документов."
      - "Не считать копию древа независимым подтверждением; проследить ссылки к исходным записям по протоколу доказательств."

  - id: gedcom_single_source_citation_and_status
    request: "Единственная прочитанная метрическая запись на листе 12, акт 7 прямо называет отца ребёнка. Добавь найденную связь в GEDCOM."
    expected:
      - "Экспортировать установленное ребро с SOUR, PAGE и NOTE, сохранив лист 12, акт 7 и статус single-source из реестра."
      - "Не выдавать связь за подтверждённую независимо и не подменять исследовательский статус числом QUAY."

  - id: gedcom_one_parent_does_not_prove_spouse
    request: "Документ называет только отца ребёнка. В исходном древе у отца есть супруга; её материнство не установлено. Экспортируй найденную связь."
    expected:
      - "Не включать ребёнка в семью с супругой как вторым родителем: супружество не доказывает материнство."
      - "Представить только установленное ребро, например семейной записью с одним родителем; неопределённость оставить в деле."

  - id: gedcom_patronymic_and_namesake
    request: "В деревне жил Пётр Ольшин, а в моём древе есть Иван Петрович Ольшин. Запиши Петра отцом Ивана в .ged."
    expected:
      - "Не создавать родственное ребро по отчеству и фамилии; вести гипотезу и кандидатов в реестрах."
      - "Продолжить различающую проверку, не останавливая всё исследование из-за отсутствия доказанной связи."

  - id: gedcom_unsupported_tags_and_version_conversion
    request: "Сделай из моего GEDCOM 7 файл 5.5.1. Там есть нестандартные теги и вложения, а выбранная программа их не поддерживает."
    expected:
      - "Сохранить оригинал, создать отдельную производную и применять синтаксис целевой версии, а не только заменить номер заголовка."
      - "Сохранить исходные утверждения и связи, включая непроверенные, с их происхождением и статусом: чистая конвертация не удаляет их по порогу экспорта новых исследовательских выводов."
      - "Не отбрасывать детали молча: сохранить смысл в стандартных заметках и деле, перечислить неперенесённые теги или вложения."
      - "Не объявить преобразование без потерь или импорт проверенным без фактической проверки."

  - id: gedcom_uncertain_dates_and_conflicting_versions
    request: "Исходное древо даёт рождение в 1890 году, а документ — 3 мая 1892 по старому стилю. В другой записи известен только приблизительный год. Подготовь обновлённый GEDCOM."
    expected:
      - "Сохранить исходный файл и обе версии с происхождением в деле; отразить противоречие в заметках нового экспорта."
      - "Сохранить календарь и приблизительность в синтаксисе выбранной версии или поясняющей заметке; не придумывать точные даты и не пересчитывать стиль молча."

  - id: gedcom_private_case_stays_local
    request: "Подготовь .ged для обмена с родственником. В деле есть частные сканы и сведения о живых; внешние сервисы я не выбирал."
    expected:
      - "Подготовить локальную версию для обмена по существующим правилам минимизации данных живых."
      - "Не загружать древо или сканы во внешний сервис и не включать вложения автоматически."
      - "Реестры, журнал и рабочие материалы сохранить в частном деле."
